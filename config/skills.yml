# Deterministic skill taxonomy. Matching is phrase-boundary aware (see
# processing/skills.py) — aliases are matched as whole tokens/phrases to avoid
# false positives (e.g. "Go" the language must not match the word "going").
#
# canonical: category, optional aliases, and optional `word_boundary` hints for
# short/ambiguous names that require stricter matching.

Programming:
  Python: {}
  Java: { aliases: ["Core Java"] }
  "C#": { aliases: ["CSharp", "C-Sharp", ".NET C#"] }
  "C++": { aliases: ["CPP"] }
  JavaScript: { aliases: ["JS", "ECMAScript"] }
  TypeScript: { aliases: ["TS"] }
  Scala: {}
  Go: { aliases: ["Golang"], require_exact: true }
  SQL: {}
  Shell: { aliases: ["Bash", "Shell scripting"] }

