[project]
name = "financial-services-job-intelligence"
version = "0.1.0"
description = "Capgemini FS Client Job Intelligence POC — public US job collection for Wells Fargo, Goldman Sachs, and BNY."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Capgemini FS Job Intelligence POC" }]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "playwright>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "temporalio>=1.6",
    "typer>=0.12",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.scripts]
job-intel = "job_intelligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "B008",   # Typer uses function calls in argument defaults
    "UP042",  # keep (str, Enum) — most compatible with Temporal/Pydantic serialization
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real career sites; skipped unless RUN_LIVE_SCRAPER_TESTS=true",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
